<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FamilyCheck AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:#0b0b14;color:#eee;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
h1{font-size:2.2rem;margin:0;background:linear-gradient(90deg,#8b5cf6,#3b82f6);-webkit-background-clip:text;color:transparent}
p.sub{color:#9ca3af;margin:6px 0 24px}
.card{background:#151525;border:1px solid #26263d;border-radius:16px;padding:22px;margin-bottom:18px}
.drop{border:2px dashed #4b4b7a;border-radius:14px;padding:36px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.on{border-color:#8b5cf6;background:#1b1b33}
label{display:block;font-size:.85rem;color:#9ca3af;margin:14px 0 6px}
select,input[type=text]{width:100%;padding:11px;border-radius:10px;border:1px solid #2f2f4d;background:#0f0f1c;color:#eee;font-size:1rem}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;font-size:1.05rem;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,#8b5cf6,#3b82f6)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{height:12px;background:#222238;border-radius:8px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#3b82f6);transition:width .4s}
.label{font-size:1.5rem;font-weight:700;text-align:center;padding:14px;border-radius:12px;margin:10px 0}
.good{background:#12351f;color:#4ade80}.mid{background:#3a2f10;color:#fbbf24}.bad{background:#3a1515;color:#f87171}.unk{background:#25253a;color:#c4b5fd}
.score{text-align:center;font-size:3rem;font-weight:800}.score small{font-size:1rem;color:#9ca3af}
.row{margin:12px 0}.row .t{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.muted{color:#9ca3af;font-size:.85rem}ul{padding-left:18px}.hide{display:none}a{color:#8b5cf6}
</style></head><body><div class="wrap">
<h1>FamilyCheck AI</h1><p class="sub">Find out if a movie is suitable for your family, before you watch it.</p>

<div class="card" id="form">
  <div class="drop" id="drop">🎬 <b>Click here to choose a movie</b><br><span class="muted" id="fname">MP4, AVI or MOV</span></div>
  <input type="file" id="file" accept=".mp4,.avi,.mov" hidden>
  <label>Movie title (optional)</label><input type="text" id="title" placeholder="Example: Inception">
  <label>Who will watch?</label>
  <select id="age"><option value="under7">Young children (under 7)</option><option value="7to12" selected>Children (7 to 12)</option><option value="teen">Teenagers</option><option value="adult">Adults</option></select>
  <label>How strict?</label>
  <select id="tol"><option value="strict">Strict</option><option value="normal" selected>Normal</option><option value="relaxed">Relaxed</option></select>
  <label>Subtitles file .srt (optional, improves results)</label><input type="file" id="srt" accept=".srt">
  <button id="go" disabled>Analyze movie</button>
</div>

<div class="card hide" id="prog"><b id="pmsg">Starting...</b><div class="bar" style="margin-top:12px"><div id="pbar"></div></div>
<p class="muted">This can take a while for long movies. Keep this page open.</p></div>

<div class="card hide" id="res"></div>
<p class="muted">AI estimate, not an official rating. Always use your own judgment.</p>
</div>
<script>
const $=id=>document.getElementById(id);let file=null;
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{file=e.target.files[0];if(file){$('fname').textContent=file.name;$('go').disabled=false;$('drop').classList.add('on')}};
const NAMES={violence:'Violence',sexual:'Sexual content',language:'Bad language',horror:'Horror / scary',substances:'Drugs & alcohol'};
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok){let m='Error';try{m=(await r.json()).detail}catch(e){}throw new Error(m)}return r.json()}
$('go').onclick=async()=>{
  try{
    $('form').classList.add('hide');$('prog').classList.remove('hide');$('res').classList.add('hide');
    $('pmsg').textContent='Uploading movie...';
    let f=new FormData();f.append('file',file);f.append('title',$('title').value);
    const {id}=await api('/api/upload',{method:'POST',body:f});
    let a=new FormData();a.append('age_group',$('age').value);a.append('tolerance',$('tol').value);a.append('official_title',$('title').value);
    if($('srt').files[0])a.append('subtitles',$('srt').files[0]);
    await api('/api/analyze/'+id,{method:'POST',body:a});
    const t=setInterval(async()=>{
      try{const p=await api('/api/progress/'+id);
        $('pbar').style.width=Math.round(p.progress*100)+'%';$('pmsg').textContent=(p.message||'Working...')+' ('+Math.round(p.progress*100)+'%)';
        if(p.status==='done'){clearInterval(t);show(await api('/api/results/'+id))}
        if(p.status==='failed'){clearInterval(t);fail(p.message)}
      }catch(e){clearInterval(t);fail(e.message)}},2000);
  }catch(e){fail(e.message)}};
function fail(m){$('prog').classList.add('hide');$('form').classList.remove('hide');alert('Problem: '+m)}
function show(r){
  $('prog').classList.add('hide');const v=r.verdict,box=$('res');box.classList.remove('hide');
  const cls=v.label.startsWith('NOT')?'bad':v.label.startsWith('PARTIALLY')?'mid':v.label==='FAMILY FRIENDLY'?'good':'unk';
  let h=`<div class="label ${cls}">${v.label}</div><div class="score">${v.suitability_score}<small> / 100 suitability</small></div>`;
  for(const k in NAMES){const s=v.category_scores[k],c=v.category_confidence[k];
    h+=`<div class="row"><div class="t"><span>${NAMES[k]}</span><span>${s==null?'Not analyzed':s+'%'}</span></div><div class="bar"><div style="width:${s||0}%"></div></div>${c!=null?`<span class="muted">Model confidence: ${Math.round(c*100)}%</span>`:''}</div>`}
  h+=`<p class="muted">Bars = estimated amount of problematic content. Confidence = how sure the AI is. They are different things.</p>`;
  if(r.metadata&&r.metadata.official_rating)h+=`<p>Official rating (separate): <b>${r.metadata.official_rating}</b></p>`;
  h+='<b>Why?</b><ul>'+v.reasons.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  if(v.scenes.length)h+='<b>Flagged scenes</b><ul>'+v.scenes.slice(0,30).map(s=>{const t=Math.floor(s.timestamp||0);return `<li>${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')} - ${NAMES[s.category]}</li>`}).join('')+'</ul>';
  h+=`<a href="/api/report/${r.id}.pdf"><button type="button">Download PDF report</button></a><button type="button" onclick="location.reload()" style="background:#26263d">Analyze another movie</button>`;
  box.innerHTML=h}
</script></body></html>
